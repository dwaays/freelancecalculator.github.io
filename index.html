<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance Calculator</title>
  </head>
  <body>

    <h1>Freelance Price Calculator</h1>
    <input id="pages" type="number" placeholder="Number of pages">
    <input id="deadline" type="number" placeholder="Days to complete">
    <select id="currency">
      <option value="USD">USD $</option>
      <option value="GBP">GBP £</option>
      <option value="EUR">EUR €</option>
      <option value="GHS">GHS ₵</option>
    </select>
    <button id="calcBtn">Calculate Price</button>
    <p id="result"></p>
    
  </body>
</html>
